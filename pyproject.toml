[project]
name = "cirque-cal"
version = "0.1.0"
description = "Scrape NYC aerial/lyra class schedules into a subscribable calendar feed"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "icalendar>=6.0",
    "playwright>=1.45",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
cirque-cal = "cirque_cal.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cirque_cal"]
